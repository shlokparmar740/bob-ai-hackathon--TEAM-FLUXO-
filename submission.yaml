submission:
  title: "MEWTWO"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   In the first 72 hours after a major disaster, response coordinators struggle to allocate
    scarce rescue teams and relief supplies across affected zones using incomplete,
     rapidly changing information, leading to aid being sent to wrong locations.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    An AI-powered autonomous disaster response planner that systematically prioritizes
     needs versus available resources and allocates scarce rescue teams and medical units
      during emergencies using IBM Bob.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Data-driven prioritization of disaster relief needs versus available resources"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Automated coordination and allocation planning for rescue teams and medical units"
    - "Conversational workflow assistance and optimization integrated with IBM Bob"
    - ""                               # optional 4th
    - ""                               # optional 5th

  tech_stack:
    languages: ["Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI" , "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM BOB"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["MongoDB"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Pandas", "NumPy", "Google OR-Tools", "WebSockets", "Leaflet", "OSRM", "Scikit-learn", "GitHub Actions"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of building an efficient resource allocation system combined with an 
    intuitive coordinator dashboard that integrates IBM Bob for seamless planning.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Real-time WebSocket live updates and complete OSRM routing are partially mocked due to 
    time constraints in this hackathon version.

